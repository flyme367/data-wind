[package]
name = "protocol-smoke"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "GPU-independent Wasm ABI test for the actual engine response encoder"

[lib]
crate-type = ["cdylib"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
bytemuck.workspace = true
flatbuffers.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
